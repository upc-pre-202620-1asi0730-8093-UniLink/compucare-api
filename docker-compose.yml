services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compucare
      POSTGRES_USER: compucare
      POSTGRES_PASSWORD: compucare_dev_only # Local development ONLY
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compucare -d compucare"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_dev:
