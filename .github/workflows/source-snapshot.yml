name: Source snapshot for team handoff

on:
  push:
    paths:
      - '.github/workflows/source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create complete source backup
        run: |
          zip -qr /tmp/compucare-api-original-main.zip . \
            -x '.git/*' -x '.git/**' \
            -x '.env.local' -x '**/bin/*' -x '**/obj/*'
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: compucare-api-original-main
          path: /tmp/compucare-api-original-main.zip
          retention-days: 30
