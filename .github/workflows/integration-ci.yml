name: Backend PostgreSQL integration

on:
  pull_request:
    branches: [dev, main]
  push:
    branches:
      - 'feature/**'
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-account-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compucare_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: compucare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compucare_test -d compucare_test"
          --health-interval 10s --health-timeout 5s --health-retries 8
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CompuCare: Host=localhost;Port=5432;Database=compucare_test;Username=compucare_test;Password=ci_test_password
      Jwt__SigningKey: "CI_ONLY_CompuCare_Test_Signing_Key_2026_NotForProduction"
      Jwt__Issuer: CompuCare.Api
      Jwt__Audience: CompuCare.Frontend
      DemoSeed__Enabled: "true"
      DemoSeed__Password: "TestOnlyStrongPass2026!"
      Database__AutoCreateDevelopment: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        run: dotnet build CompuCare.sln --configuration Release
      - name: Start backend with PostgreSQL and development demo users
        run: |
          dotnet run --no-launch-profile --project src/CompuCare.Api --configuration Release --no-build --urls http://127.0.0.1:5147 > api.log 2>&1 &
      - name: Verify requests shared across roles
        run: python3 scripts/smoke_cross_accounts.py
      - name: Show backend logs if smoke test fails
        if: failure()
        run: cat api.log || true
