name: Backend CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches:
      - main
      - dev
      - 'feature/**'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CompuCare.sln
      - run: dotnet build CompuCare.sln --configuration Release --no-restore
      - run: dotnet test CompuCare.sln --configuration Release --no-build --verbosity normal

  validate-migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/backend-implement-bc01-bc05'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CompuCare.sln
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Generate migration only when missing
        env:
          ConnectionStrings__CompuCare: Host=127.0.0.1;Database=design_only;Username=design_only
        run: |
          if ls src/CompuCare.Infrastructure/Persistence/Migrations/*_InitialCreate.cs >/dev/null 2>&1; then
            echo 'Migration already checked into source control.'
          else
            dotnet ef migrations add InitialCreate \
              --project src/CompuCare.Infrastructure/CompuCare.Infrastructure.csproj \
              --startup-project src/CompuCare.Api/CompuCare.Api.csproj \
              --output-dir Persistence/Migrations
          fi
      - name: Commit generated migration to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CompuCare.Infrastructure/Persistence/Migrations/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ef): add generated PostgreSQL InitialCreate migration'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compucare-ef-migration
          path: src/CompuCare.Infrastructure/Persistence/Migrations/
          if-no-files-found: error
